name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SQLite + drizzle 的类型与测试都不需要外部服务；
      # Meilisearch / Chrome / 模型服务都在测试里用 mock 或跳过。
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (shared)
        run: pnpm --filter @karakeep/shared exec vitest run

      - name: Unit tests (trpc)
        run: pnpm --filter @karakeep/trpc exec vitest run routers/bookmarks.search.test.ts routers/chunking-invariants.test.ts

      - name: Unit tests (web)
        run: pnpm --filter @karakeep/web exec vitest run lib/citations.test.ts

      - name: Production build
        run: pnpm --filter @karakeep/web run build
        env:
          NEXTAUTH_SECRET: ci-placeholder-secret
          DATA_DIR: ${{ runner.temp }}/iv-data
