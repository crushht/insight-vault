<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#26292E"/>
      <stop offset="0.55" stop-color="#191B1F"/>
      <stop offset="1" stop-color="#0F1114"/>
    </linearGradient>
    <linearGradient id="bar" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7BEBF5"/>
      <stop offset="0.45" stop-color="#4FC9E8"/>
      <stop offset="1" stop-color="#4A57EE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#5FD8F0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5FD8F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#halo)"/>
  <rect x="6" y="6" width="500" height="500" rx="111" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <g transform="rotate(18 256 256)">
    <rect x="224" y="118" width="66" height="276" rx="16" fill="#4A57EE" opacity="0.35" filter="url(#blur)"/>
    <rect x="224" y="118" width="66" height="276" rx="16" fill="url(#bar)"/>
  </g>
</svg>